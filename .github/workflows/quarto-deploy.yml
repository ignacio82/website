name: ignacio.martinez.fyi

on:
  push:
    branches:
      - main  # Or your default branch
  workflow_dispatch: # Allows manual triggering

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push to gh-pages branch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- START: Added R Setup ---
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release' # Or specify a particular R version like '4.3.2'
      # --- END: Added R Setup ---
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2
      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2
      - name: Install R packages
        run: install.packages(c("rmarkdown", "knitr", "tinytex")))
        shell: Rscript {0}
      - name: Render CV PDF
        run: rmarkdown::render("Ignacio Martinez CV.Rmd", output_file = "Ignacio-Martinez-CV.pdf")
        shell: Rscript {0}
      - name: Commit and push updated CV PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ignacio-Martinez-CV.pdf
          if ! git diff --staged --quiet; then
            git commit -m "Update Ignacio-Martinez-CV.pdf [skip ci]"
            git push origin HEAD:main
          fi
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        # You can specify a Quarto version if needed:
        # with:
        #   version: "1.4" # Or "pre-release"

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages # Specifies publishing to the gh-pages branch
          # path: "." # Optional: path to the Quarto project, defaults to root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for publishing
