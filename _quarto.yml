project:
  type: website
  output-dir: docs
  render:
  - "*.qmd"
website:
  title: "Dr. Ignacio Martinez"
  favicon: img/favicon.png
  site-url: https://ignacio.martinez.fyi
  open-graph: true
  twitter-card: true
  navbar:
    border: true
    left:
      - href: index.qmd
        text: Home
        icon: house
      - icon: book
        text: Book
        href: https://book.martinez.fyi
        target: _blank
      - icon: robot
        text: Iggy
        href: https://iggy.martinez.fyi
        target: _blank        
      - icon: file-earmark-person
        text: CV
        href: Ignacio-Martinez-CV.pdf
        target: _blank
    right:
      - text: "{{< ai google-scholar >}}"
        aria-label: Google Scholar
        href: https://scholar.google.com/citations?user=Kq8kZToAAAAJ
        target: _blank
      - icon: github
        aria-label: GitHub
        href: https://github.com/ignacio82
        target: _blank
      - icon: linkedin
        aria-label: LinkedIn
        href: https://www.linkedin.com/in/ignacio82/
        target: _blank
      - icon: mastodon
        aria-label: Mastodon
        href: https://mastodon.social/@ignacio
        target: _blank
  page-footer:
    border: true
    left: "© Ignacio Martinez, PhD"
    right:
      - text: "ignacio@martinez.fyi"
        href: mailto:ignacio@martinez.fyi
     
format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
        <script defer src="https://umami.martinez.fyi/script.js" data-website-id="0805cacb-45a2-4531-8e52-728ba246c576"></script>
        <link rel="me" href="https://mastodon.social/@ignacio">
editor: visual

resources:
  - CNAME
  - Ignacio-Martinez-CV.pdf
  - BingSiteAuth.xml
  - ta-te-ti.html
  
